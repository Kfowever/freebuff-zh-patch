name: 漏翻或译文问题
description: 反馈 Freebuff Windows 中文补丁中的英文残留、中英混排或错误译文。
title: "[汉化] "
body:
  - type: input
    id: app-version
    attributes:
      label: Freebuff 版本
      placeholder: 例如 0.0.196.0
    validations:
      required: true
  - type: input
    id: patch-version
    attributes:
      label: 翻译库版本
      placeholder: 例如 0.10.1
    validations:
      required: true
  - type: input
    id: installer-version
    attributes:
      label: 安装器版本（可选）
      placeholder: 例如 0.11.0，可从汉化管理查看
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: 界面位置
      placeholder: 例如左侧每日小时额度的悬浮提示
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 英文原文或问题描述
      description: 尽量提供完整文案；不要填写账号密码、API 密钥或私人聊天内容。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 建议译文
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: 截图（可选）
      description: 请遮盖邮箱、访问令牌、项目路径等个人信息后再上传。
    validations:
      required: false
